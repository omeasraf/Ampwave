<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Ampwave Capsule</title>
  <desc>A rounded capsule containing Ampwave's waveform as negative space.</desc>
  <defs>
    <mask id="waveform-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="white"/>
      <g fill="none" stroke="black" stroke-width="14" stroke-linecap="round">
        <path d="M72 111v34"/>
        <path d="M100 91v74"/>
        <path d="M128 74v108"/>
        <path d="M156 94v68"/>
        <path d="M184 113v30"/>
      </g>
    </mask>
  </defs>
  <rect
    x="12"
    y="44"
    width="232"
    height="168"
    rx="84"
    fill="black"
    mask="url(#waveform-cutout)"
  />
</svg>
